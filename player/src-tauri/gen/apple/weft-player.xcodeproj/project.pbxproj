		5F79CBA11827C6E2C1B591E5 /* Build Rust Code */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Build Rust Code";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a",
				"$(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "export PATH=\"/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:$HOME/.cargo/bin:$PATH\"\n# Not `npm run -- tauri ...`: npm changes into the folder of package.json (the main folder of the repository), where the CLI finds the project of Weft\n# (src-tauri) and not this one (player/src-tauri) - and asks that one's build for the options (\"Connection refused\"). From here it finds this one.\n\"$SRCROOT/../../../../node_modules/.bin/tauri\" ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths \"${FRAMEWORK_SEARCH_PATHS:?}\" --header-search-paths \"${HEADER_SEARCH_PATHS:?}\" --gcc-preprocessor-definitions \"${GCC_PREPROCESSOR_DEFINITIONS:-}\" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}\n\n# swift-rs's build.rs bundles the \"Tauri\" SPM package (which pulls in\n# \"SwiftRs\", providing retain_object/release_object/string_from_bytes)\n# straight into libapp.a via a `+bundle` native-lib directive, and\n# promotes @_cdecl exports that Xcode 27's SwiftPM internalizes\n# (nm shows local 't') back to global with llvm-objcopy so Rust can\n# link against them - but it only globalizes the object member named\n# after the package being linked (\"Tauri.o\"), never the nested\n# \"SwiftRs.o\" that retain_object/release_object/string_from_bytes\n# actually live in. That gap silently doesn't matter for Debug\n# (Xcode's SwiftPM keeps these symbols global there without any\n# promotion needed), but Release does internalize them, so\n# they stay local, get skipped, and the app fails to link with\n# \"Undefined symbols: _retain_object, ...\". Work around the gap by\n# promoting them ourselves before libTauri.a's own object code gets\n# bundled into the final libapp.a.\nfor ARCH in ${ARCHS:?}; do\n  LIBAPP=\"$SRCROOT/Externals/$ARCH/${CONFIGURATION}/libapp.a\"\n  [ -f \"$LIBAPP\" ] || continue\n  /usr/bin/nm \"$LIBAPP\" 2>/dev/null | grep -q \"T _retain_object\" && continue\n  TAURI_A=$(/usr/bin/find \"$SRCROOT/../../target\" -path \"*/out/swift-rs/Tauri/out/Products/*-iphoneos/libTauri.a\" -print0 2>/dev/null \\\n    | xargs -0 /usr/bin/stat -f \"%m %N\" 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)\n  if [ -z \"$TAURI_A\" ]; then\n    echo \"warning: could not find libTauri.a to splice swift-rs runtime symbols into $LIBAPP\"\n    continue\n  fi\n  OBJCOPY=\"$(rustc --print sysroot 2>/dev/null)/lib/rustlib/$(uname -m | sed s/arm64/aarch64/)-apple-darwin/bin/llvm-objcopy\"\n  if [ -x \"$OBJCOPY\" ]; then\n    cp \"$TAURI_A\" \"$TAURI_A.globalized\"\n    \"$OBJCOPY\" --globalize-symbol=_retain_object --globalize-symbol=_release_object \\\n      --globalize-symbol=_string_from_bytes --globalize-symbol=_data_from_bytes \\\n      \"$TAURI_A.globalized\"\n    TAURI_A=\"$TAURI_A.globalized\"\n  else\n    echo \"warning: llvm-objcopy not found (rustup component add llvm-tools); swift-rs runtime symbols will stay internalized\"\n  fi\n  echo \"note: splicing swift-rs runtime symbols from $TAURI_A into $LIBAPP\"\n  /usr/bin/libtool -static -o \"$LIBAPP.spliced\" \"$LIBAPP\" \"$TAURI_A\"\n  mv \"$LIBAPP.spliced\" \"$LIBAPP\"\ndone\n";
		};
/* End PBXShellScriptBuildPhase section */

